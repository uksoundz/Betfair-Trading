[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradescout"
version = "0.1.0"
description = "Football trading scout: pulls every fixture of the day, models it, ranks the trades most likely to pay off on Betfair."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tzdata; sys_platform == 'win32'",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "requests>=2.31",
  "rich>=13.0",
  "jinja2>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["httpx>=0.27",
    "pytest>=7.4"]
betfair = ["betfairlightweight>=2.19"]

[project.scripts]
tradescout = "tradescout.cli:main"

[tool.setuptools.packages.find]
include = ["tradescout*"]

[tool.setuptools.package-data]
tradescout = ["web/static/*", "report/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
